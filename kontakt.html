    /*Бургер*/
    .burger_menu {
        display: block;
        position: relative;
        width: 30px;
        height: 20px;
        transition: 0.3s ease;
                    }

.burger_menu::before,
    .burger_menu::after {
        content: ''; /* пустой контент */
        background: #352d2d; /*цвет бургера*/
        position: absolute; /* позиция для общего блока*/
        width: 100%; /* ширина*/
        height: 2px; /* толщина полосок бургера */
        transition: 0.3s ease;
    }


 .burger_menu::before {
        top: 0; /* расположение верхней линии бургера */
    }

    .burger_menu span { /*средняя линия в виде span*/
        background: #fff;
        position: absolute; 
        width: 100%;
        top: 9px;
        height: 2px; 
    }
    .burger_menu::after {
        bottom: 0; /* расположение нижней линии бургера */
    }

    /*Меню*/
    .menu {
        position: absolute;
        top: 0;
        right: 0;
        width: 50vw;
        height: 100vh;
        background: #272727;
        border: 1px solid #fff;
        padding: 20px 10px;
        transform: translateX(100%);
    }

    .menu-items {
        flex-direction: column;
        text-align: right;
        height: 50%;
    }

    .polosa1{
        width: 80%;
    }

    /* active */

    .burger_menu.active {
        z-index: 3;
        transform: translateX(-15vw);
        transition: 0.3s ease;
    }

    .burger_menu.active::before {
        transform: rotate(45deg);
        top: 9px;
        transition: 0.3s ease;
    }
    .burger_menu.active::after {
        transform: rotate(-45deg);
        bottom: 9px;
        transition: 0.3s ease;
    }

    .burger_menu.active span {
        transform: scale(0);
    }

    .menu.active {
       transform: translate(0);
       transition: 0.3s ease;
    }
}
